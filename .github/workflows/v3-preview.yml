name: V3 Gerçek Veri Önizleme

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "BIST sembolü (ör. ZGYO)"
        required: true
        default: "ZGYO"
      interval:
        description: "Aralık"
        required: true
        default: "1d"
        type: choice
        options:
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 4h
          - 1d
          - 1wk
          - 1mo
      period:
        description: "Geçmiş veri"
        required: true
        default: "2y"
      provider:
        description: "Veri sağlayıcı"
        required: true
        default: "AUTO"
        type: choice
        options:
          - AUTO
          - BORSAPY
          - YFINANCE
      telegram:
        description: "Deneme sonucunu Telegram'a da gönder"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - rebuild/v3-market-analysis-engine
    paths:
      - ".v3-preview-trigger"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/technical_bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt
      - name: Bağımlılıkları yükle
        run: python -m pip install --requirement requirements.txt
      - name: V3 preview üret ve isteğe bağlı Telegram'a gönder
        env:
          PYTHONPATH: ../..
          PREVIEW_SYMBOL: ${{ github.event.inputs.symbol || 'ZGYO' }}
          PREVIEW_INTERVAL: ${{ github.event.inputs.interval || '1d' }}
          PREVIEW_PERIOD: ${{ github.event.inputs.period || '2y' }}
          PREVIEW_PROVIDER: ${{ github.event.inputs.provider || 'AUTO' }}
          PREVIEW_TELEGRAM: ${{ github.event_name == 'push' || github.event.inputs.telegram == 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TECHNICAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TECHNICAL_TOPIC_ID }}
        run: |
          args=(
            "$PREVIEW_SYMBOL"
            --interval "$PREVIEW_INTERVAL"
            --period "$PREVIEW_PERIOD"
            --provider "$PREVIEW_PROVIDER"
            --output reports/v3_preview
          )
          if [ "$PREVIEW_TELEGRAM" = "true" ]; then
            args+=(--telegram)
          fi
          python -m src.v3_preview_cli "${args[@]}"
      - name: Preview artifact yükle
        uses: actions/upload-artifact@v7
        with:
          name: v3-preview-${{ github.event.inputs.symbol || 'ZGYO' }}-${{ github.event.inputs.interval || '1d' }}-${{ github.run_id }}
          path: apps/technical_bot/reports/v3_preview/**
          if-no-files-found: error
          retention-days: 7
