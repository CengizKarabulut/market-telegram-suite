name: V3 Gerçek Veri Önizleme

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "BIST sembolü (ör. ZGYO)"
        required: true
        default: "ZGYO"
      interval:
        description: "Aralık"
        required: true
        default: "1d"
        type: choice
        options:
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 4h
          - 1d
          - 1wk
          - 1mo
      period:
        description: "Geçmiş veri"
        required: true
        default: "2y"
      provider:
        description: "Veri sağlayıcı"
        required: true
        default: "AUTO"
        type: choice
        options:
          - AUTO
          - BORSAPY
          - YFINANCE

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/technical_bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt
      - name: Bağımlılıkları yükle
        run: python -m pip install --requirement requirements.txt
      - name: V3 preview üret
        env:
          PYTHONPATH: ../..
        run: >-
          python -m src.v3_preview_cli
          "${{ inputs.symbol }}"
          --interval "${{ inputs.interval }}"
          --period "${{ inputs.period }}"
          --provider "${{ inputs.provider }}"
          --output reports/v3_preview
      - name: Preview artifact yükle
        uses: actions/upload-artifact@v7
        with:
          name: v3-preview-${{ inputs.symbol }}-${{ inputs.interval }}-${{ github.run_id }}
          path: apps/technical_bot/reports/v3_preview/**
          if-no-files-found: error
          retention-days: 7
