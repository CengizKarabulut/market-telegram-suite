name: Research Report Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/technical_bot/src/research_*.py'
      - 'apps/technical_bot/src/fundamental_*.py'
      - 'apps/technical_bot/tests/test_research_engine.py'
      - '.github/workflows/research-report-smoke.yml'

permissions:
  contents: read

jobs:
  live-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/technical_bot
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt
      - name: Bağımlılıkları yükle
        run: python -m pip install --requirement requirements.txt
      - name: GARAN ZGYO ASELS canlı araştırma raporlarını üret
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.fundamental_card import render_fundamental_card
          from src.research_card import render_research_card
          from src.research_chart import render_research_chart
          from src.research_risk import build_research_report

          root = Path('reports/research-smoke')
          root.mkdir(parents=True, exist_ok=True)

          for ticker in ('GARAN', 'ZGYO', 'ASELS'):
              target = root / ticker
              target.mkdir(parents=True, exist_ok=True)
              report = build_research_report(ticker)
              summary = render_research_card(report, target / f'{ticker}_arastirma.png')
              fundamental = render_fundamental_card(report.fundamental, target / f'{ticker}_temel.png')
              technical = render_research_chart(ticker, report, target / f'{ticker}_teknik_yapi.png')
              (target / f'{ticker}_arastirma.json').write_text(
                  json.dumps(report.to_dict(), ensure_ascii=False, indent=2, default=str) + '\n',
                  encoding='utf-8',
              )

              if report.price is None or report.price <= 0:
                  raise SystemExit(f'{ticker}: current price is missing')
              if report.research_score is None:
                  raise SystemExit(f'{ticker}: research score is missing')
              if report.coverage < 0.40:
                  raise SystemExit(f'{ticker}: research coverage too low: {report.coverage:.0%}')
              if any(zone.midpoint >= report.price for zone in report.supports):
                  raise SystemExit(f'{ticker}: support above/equal current price')
              if any(zone.midpoint <= report.price for zone in report.resistances):
                  raise SystemExit(f'{ticker}: resistance below/equal current price')
              if any(zone.status == 'TARİHSEL / UZAK SEVİYE' for zone in (*report.supports, *report.resistances)):
                  raise SystemExit(f'{ticker}: stale/far level leaked into actionable output')
              if len(report.dimensions) != 5:
                  raise SystemExit(f'{ticker}: expected five research dimensions')
              for image in (summary, fundamental, technical):
                  if image.stat().st_size < 10_000:
                      raise SystemExit(f'{ticker}: unexpectedly small image {image.name}')

              print(
                  ticker,
                  'profile=', report.profile,
                  'score=', report.research_score,
                  'coverage=', report.coverage,
                  'balance=', report.financial.get('balance_label'),
                  'quality=', report.financial.get('earnings_quality_label'),
                  'debt=', report.financial.get('debt_direction'),
                  'valuation=', report.valuation.get('score'), report.valuation.get('scope'),
                  'technical=', report.technical.get('score'), report.technical.get('structure', {}).get('state'),
                  'main_risk=', None if report.main_risk is None else (report.main_risk.name, report.main_risk.score),
                  'supports=', [(z.low, z.high, z.score, z.status) for z in report.supports],
                  'resistances=', [(z.low, z.high, z.score, z.status) for z in report.resistances],
              )
          PY
      - name: Smoke çıktılarını sakla
        uses: actions/upload-artifact@v7
        with:
          name: research-report-smoke-${{ github.run_id }}
          path: apps/technical_bot/reports/research-smoke/
          if-no-files-found: error
          retention-days: 7
