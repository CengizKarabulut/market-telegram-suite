name: Telegram Komut Botu

on:
  workflow_dispatch:
  schedule:
    # Dinleme zinciri koşudan koşuya devredilir; bu cron yalnızca zincir
    # koptuğunda (hata, iptal, kotanın dolması) yeniden başlatan emniyet ağıdır.
    # GitHub'ın sık zamanlanmış koşuları güvenilir çalışmadığı için tek başına
    # yeterli değildir.
    - cron: "0 6-18 * * 1-5"

permissions:
  contents: read
  actions: write

concurrency:
  # Aynı anda tek dinleyici çalışır; cron ile zincir çakışırsa yeni koşu sıraya
  # girer ve öncekinin hemen ardından devam eder.
  group: telegram-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kodu indir
        uses: actions/checkout@v6

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları yükle
        run: python -m pip install --requirement requirements.txt

      - name: Durum dosyalarını önbellekten getir
        uses: actions/cache@v4
        with:
          path: |
            reports/telegram_offset.json
            reports/scan_schedule.json
            reports/screener.json
            reports/bist_universe.json
          key: telegram-bot-${{ github.run_id }}
          restore-keys: telegram-bot-

      - name: Komutları işle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003502567927"
          TELEGRAM_MESSAGE_THREAD_ID: "3982"
          # Boş bırakılırsa herkes komut verebilir. Kısıtlamak için depo
          # ayarlarından TELEGRAM_ALLOWED_USERS secret'ını tanımlayın.
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Koşu bu süre boyunca dinler, sonra kendini yeniden tetikler.
          BOT_RUN_MINUTES: "50"
          BOT_LONG_POLL_SECONDS: "25"
          BOT_SELF_RESTART: "1"
          # Tarama zamanlamasını da bu süreç yürütür; GitHub'ın zamanlanmış
          # koşuları güvenilir çalışmadığı için cron yalnızca yedektir.
          BOT_DRIVES_SCAN: "1"
        run: python -m src.bot_runner

      - name: Komut çıktılarını sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-ciktilari-${{ github.run_id }}
          path: reports/komut/**/*.png
          if-no-files-found: ignore
          retention-days: 7
