name: Teknik Bot Scheduler Heartbeat
run-name: "Teknik Bot Scheduler Heartbeat"

on:
  workflow_dispatch:
  schedule:
    # Europe/Istanbul = UTC+3. Scheduler zinciri hafta ici 09:00'da baslar.
    - cron: "0 6 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/technical-scheduler-heartbeat.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: technical-telegram-bot
  cancel-in-progress: true

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/technical_bot
    steps:
      - name: Türkiye piyasa izleme penceresini kontrol et
        id: market_window
        shell: bash
        run: |
          set -euo pipefail
          day="$(TZ=Europe/Istanbul date +%u)"
          hhmm="$(TZ=Europe/Istanbul date +%H%M)"
          active=false

          if [ "$day" -le 5 ] && [ "$hhmm" -ge 0900 ] && [ "$hhmm" -le 1925 ]; then
            active=true
          fi

          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "TR gun=$day saat=$hhmm active=$active"

      - uses: actions/checkout@v6
        if: steps.market_window.outputs.active == 'true'

      - uses: actions/setup-python@v6
        if: steps.market_window.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt

      - name: Bağımlılıkları yükle
        if: steps.market_window.outputs.active == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Bot ve scheduler state geri yükle
        if: steps.market_window.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: |
            apps/technical_bot/reports/telegram_offset.json
            apps/technical_bot/reports/scan_schedule.json
            apps/technical_bot/reports/bot_settings.json
            apps/technical_bot/reports/watchlist.json
            apps/technical_bot/reports/screener.json
            apps/technical_bot/reports/bist_universe.json
          key: technical-scheduler-${{ github.run_id }}
          restore-keys: |
            technical-scheduler-
            technical-bot-

      - name: Botu ve planli taramalari calistir
        if: steps.market_window.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TECHNICAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TECHNICAL_TOPIC_ID }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_WORKFLOW_FILE: technical-scheduler-heartbeat.yml
          SCAN_WORKFLOW_FILE: technical-scan.yml
          BOT_RUN_MINUTES: "50"
          BOT_LONG_POLL_SECONDS: "25"
          BOT_SELF_RESTART: "1"
          BOT_DRIVES_SCAN: "1"
        run: python -m src.bot_runner_fundamental

      - name: Bot ve scheduler state sakla
        if: always() && steps.market_window.outputs.active == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/technical_bot/reports/telegram_offset.json
            apps/technical_bot/reports/scan_schedule.json
            apps/technical_bot/reports/bot_settings.json
            apps/technical_bot/reports/watchlist.json
            apps/technical_bot/reports/screener.json
            apps/technical_bot/reports/bist_universe.json
          key: technical-scheduler-${{ github.run_id }}

      - name: Komut ciktilarini sakla
        if: always() && steps.market_window.outputs.active == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: teknik-bot-ciktilari-${{ github.run_id }}
          path: apps/technical_bot/reports/komut/**/*.png
          if-no-files-found: ignore
          retention-days: 7
