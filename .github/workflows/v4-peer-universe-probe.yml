name: V4 BIST Sektör ve Eş Şirket Probu

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Boşlukla ayrılmış BIST sembolleri"
        required: true
        default: "ZGYO THYAO BIMAS AKBNK ANSGR SAHOL ASELS GEDIK"
  push:
    branches:
      - rebuild/v3-market-analysis-engine
    paths:
      - ".v4-peer-probe-trigger"

permissions:
  contents: read

jobs:
  peer-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROBE_SYMBOLS: ${{ github.event.inputs.symbols || 'ZGYO THYAO BIMAS AKBNK ANSGR SAHOL ASELS GEDIK' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt

      - name: Teknik bot bağımlılıklarını yükle
        working-directory: apps/technical_bot
        run: python -m pip install --requirement requirements.txt

      - name: BIST evrenini tek sorguda al ve sektör/eş şirket analizi üret
        working-directory: apps/technical_bot
        env:
          PYTHONPATH: ../..
        run: |
          python -m src.v4_peer_universe_probe $PROBE_SYMBOLS \
            --limit 1000 \
            --output reports/v4_peer_universe

      - name: Peer benchmark artifact yükle
        uses: actions/upload-artifact@v7
        with:
          name: v4-peer-universe-${{ github.run_id }}
          path: apps/technical_bot/reports/v4_peer_universe/**
          if-no-files-found: error
          retention-days: 7
