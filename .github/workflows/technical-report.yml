name: Teknik Rapor Üret

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Hisse sembolü"
        required: true
        default: "THYAO"
      market:
        description: "Piyasa"
        required: true
        default: "BIST"
        type: choice
        options: [BIST, US, AUTO]
      provider:
        description: "Veri kaynağı"
        required: true
        default: "AUTO"
        type: choice
        options: [AUTO, BORSAPY, YFINANCE]
      interval:
        description: "Mum aralığı"
        required: true
        default: "1d"
        type: choice
        options: ["5m", "15m", "30m", "1h", "2h", "4h", "1d", "1wk", "1mo"]
      report_detail:
        description: "Ayrıntı seviyesi"
        required: true
        default: "kompakt"
        type: choice
        options: [kompakt, dengeli, tam]
      send_telegram:
        description: "Teknik botun konusuna gönder"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/technical_bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Raporu üret
        run: |
          python -m src.stock_dashboard +            --ticker "${{ inputs.ticker }}" +            --market "${{ inputs.market }}" +            --provider "${{ inputs.provider }}" +            --interval "${{ inputs.interval }}" +            --report-detail "${{ inputs.report_detail }}"
      - name: Telegram'a gönder
        if: inputs.send_telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TECHNICAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TECHNICAL_TOPIC_ID }}
          TELEGRAM_SEND_CAPTION: "0"
          TELEGRAM_SEND_TEXT_DETAIL: "0"
        run: python -m src.send_telegram
      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teknik-rapor-${{ inputs.ticker }}-${{ inputs.interval }}
          path: apps/technical_bot/reports/
          if-no-files-found: warn
          retention-days: 14
