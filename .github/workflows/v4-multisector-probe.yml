name: V4 Çok Sektörlü Finansal Probe

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v3-market-analysis-engine
    paths:
      - ".v4-multisector-probe-trigger"

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        symbol: [ZGYO, THYAO, AKBNK, ANSGR, SAHOL]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt

      - name: Teknik bot bağımlılıklarını yükle
        working-directory: apps/technical_bot
        run: python -m pip install --requirement requirements.txt

      - name: Çok sektörlü gerçek veri probe
        working-directory: apps/technical_bot
        env:
          PYTHONPATH: ../..
        run: |
          python -m src.v4_fundamental_probe "${{ matrix.symbol }}" \
            --last-n 8 \
            --financial-group AUTO \
            --output reports/v4_multisector_probe

      - name: Probe artifact yükle
        uses: actions/upload-artifact@v7
        with:
          name: v4-multisector-${{ matrix.symbol }}-${{ github.run_id }}
          path: apps/technical_bot/reports/v4_multisector_probe/${{ matrix.symbol }}/**
          if-no-files-found: error
          retention-days: 7
