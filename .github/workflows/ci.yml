name: Monorepo Kod Kalitesi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: chart
            path: apps/chart_bot
          - app: technical
            path: apps/technical_bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements*.txt
      - name: Bağımlılıkları yükle
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --requirement requirements.txt
          if [ -f requirements-dev.txt ]; then
            python -m pip install --requirement requirements-dev.txt
          fi
      - name: Ruff
        if: matrix.app == 'technical'
        working-directory: ${{ matrix.path }}
        run: ruff check src tests
      - name: Testler
        working-directory: ${{ matrix.path }}
        run: python -m unittest discover -s tests -v

  scheduler-bootstrap:
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Teknik scheduler zincirini garanti et
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_WORKFLOW: technical-scheduler-heartbeat.yml
        shell: bash
        run: |
          set -euo pipefail
          active_count="$(
            gh api "repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=20" |
              jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length'
          )"
          if [ "${active_count}" -gt 0 ]; then
            echo "Teknik scheduler zaten aktif (${active_count})."
            exit 0
          fi
          echo "Teknik scheduler aktif degil; heartbeat baslatiliyor."
          gh workflow run "${TARGET_WORKFLOW}" --repo "${REPOSITORY}" --ref main
