name: Sistem Sağlık Kontrolü

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/technical_bot/src/research_*.py'
      - 'apps/technical_bot/src/fundamental_*.py'
      - 'apps/technical_bot/src/financial_intelligence_card.py'
      - 'apps/technical_bot/src/valuation_peer_card.py'
      - 'apps/technical_bot/src/original_indicators.py'
      - 'apps/technical_bot/src/moving_average_card.py'
      - 'apps/technical_bot/tests/**'
      - 'apps/chart_bot/src/**'
      - 'apps/chart_bot/tests/**'
      - '.github/workflows/health-check.yml'
      - '.github/workflows/manual-tools.yml'

permissions:
  contents: read

concurrency:
  group: research-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/technical_bot
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt
      - name: Bağımlılıkları yükle
        run: python -m pip install --requirement requirements.txt
      - name: Birim testleri
        run: python -m unittest discover -s tests -v
      - name: GARAN ZGYO ASELS canlı araştırma sağlığını doğrula
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import matplotlib.image as mpimg

          from src.research_commentary_rich import commentary_messages, compose_research_commentary
          from src.research_pipeline import (
              TECHNICAL_SECTION_TITLES,
              build_research_bundle,
              build_technical_bundle,
          )

          root = Path('reports/health-check')
          root.mkdir(parents=True, exist_ok=True)
          required_valuation = {
              'pe', 'pb', 'ev_ebitda', 'ev_sales', 'ps', 'p_fcf', 'peg',
              'earnings_yield', 'fcf_yield',
          }
          required_sections = {
              'ŞİRKET NE DURUMDA?',
              'OPERASYONEL KALİTE VE KÂRLILIK',
              'BİLANÇO VE LİKİDİTE',
              'KÂR KALİTELİ Mİ?',
              'BORÇ VE NAKİT NE YÖNDE?',
              'DEĞERLEME NASIL?',
              'SEKTÖR VE RAKİPLER',
              'FİNANSAL SKORLAR NE SÖYLÜYOR?',
              'TEKNİK YAPI NE DİYOR?',
              'KRİTİK SEVİYELER NEREDE?',
              'ASIL RİSK NE?',
              'SONUÇ',
          }

          def validate_white(image, ticker):
              if image.stat().st_size < 10_000:
                  raise SystemExit(f'{ticker}: unexpectedly small image {image.name}')
              pixels = mpimg.imread(image)
              corner = pixels[2, 2, :3]
              if float(corner.min()) < 0.94:
                  raise SystemExit(f'{ticker}: image background is not white: {image.name} {corner}')

          for ticker in ('GARAN', 'ZGYO', 'ASELS'):
              bundle = build_research_bundle(ticker, root / ticker)
              report = bundle.report
              commentary = compose_research_commentary(report)
              messages = commentary_messages(report)
              titles = {title for title, _ in commentary}

              if report.price is None or report.price <= 0:
                  raise SystemExit(f'{ticker}: current price is missing')
              if report.research_score is None:
                  raise SystemExit(f'{ticker}: research score is missing')
              if report.coverage < 0.40:
                  raise SystemExit(f'{ticker}: research coverage too low: {report.coverage:.0%}')
              if any(zone.midpoint >= report.price for zone in report.supports):
                  raise SystemExit(f'{ticker}: support above/equal current price')
              if any(zone.midpoint <= report.price for zone in report.resistances):
                  raise SystemExit(f'{ticker}: resistance below/equal current price')
              if any(zone.status == 'TARİHSEL / UZAK SEVİYE' for zone in (*report.supports, *report.resistances)):
                  raise SystemExit(f'{ticker}: stale/far level leaked into actionable output')
              if len(report.dimensions) != 5:
                  raise SystemExit(f'{ticker}: expected five research dimensions')
              if len(bundle.moving_averages['rows']) != 9 or len(bundle.moving_averages['summaries']) != 3:
                  raise SystemExit(f'{ticker}: moving-average table is incomplete')
              if len(commentary) != 12 or titles != required_sections:
                  raise SystemExit(f'{ticker}: analyst commentary section contract failed: {titles}')
              if any(len(paragraph) < 120 for _, paragraph in commentary):
                  raise SystemExit(f'{ticker}: analyst commentary is too shallow')
              if any(len(message) > 3900 for message in messages):
                  raise SystemExit(f'{ticker}: Telegram commentary message exceeds safe length')

              valuation_keys = set(report.valuation.get('metrics', {}))
              missing_valuation = required_valuation - valuation_keys
              if missing_valuation:
                  raise SystemExit(f'{ticker}: valuation fields missing: {sorted(missing_valuation)}')

              ratio_groups = report.financial.get('ratio_groups', ())
              forensic = report.financial.get('forensic_scores', {})
              if report.profile == 'BANK':
                  if ratio_groups:
                      raise SystemExit(f'{ticker}: industrial ratio groups leaked into bank profile')
              elif len(ratio_groups) != 4:
                  raise SystemExit(f'{ticker}: expected four financial ratio groups, got {len(ratio_groups)}')
              for key in ('altman_z', 'beneish_m', 'graham_number', 'piotroski_f', 'beta'):
                  if key not in forensic:
                      raise SystemExit(f'{ticker}: forensic score field missing: {key}')

              for image in bundle.visuals:
                  validate_white(image, ticker)

              peer = report.valuation.get('peer_analysis', {})
              print(
                  ticker,
                  'profile=', report.profile,
                  'score=', report.research_score,
                  'coverage=', report.coverage,
                  'valuation_scope=', peer.get('scope', report.valuation.get('scope')),
                  'peer_count=', peer.get('peer_count'),
                  'valuation=', {k: report.valuation.get('metrics', {}).get(k, {}).get('value') for k in sorted(required_valuation)},
                  'ratio_groups=', [group.get('name') for group in ratio_groups],
                  'forensic=', {k: forensic.get(k) for k in ('altman_z', 'beneish_m', 'graham_number', 'piotroski_f', 'beta')},
                  'commentary_messages=', len(messages),
              )

          technical_bundle = build_technical_bundle('ZGYO', root / 'technical-only' / 'ZGYO')
          technical_commentary = technical_bundle.commentary_path.read_text(encoding='utf-8')
          for title in TECHNICAL_SECTION_TITLES:
              if title not in technical_commentary:
                  raise SystemExit(f'technical-only: missing commentary section {title}')
          if 'ŞİRKET NE DURUMDA?' in technical_commentary or 'DEĞERLEME NASIL?' in technical_commentary:
              raise SystemExit('technical-only: non-technical research content leaked into manual technical mode')
          for image in technical_bundle.visuals:
              validate_white(image, 'ZGYO technical-only')
          technical_payload = json.loads(technical_bundle.json_path.read_text(encoding='utf-8'))
          if 'eski stock_dashboard içeriği kullanılmaz' not in technical_payload.get('note', ''):
              raise SystemExit('technical-only: modern engine contract note missing')
          print('TECHNICAL_ONLY_OK', technical_bundle.visuals)
          PY
      - name: Sağlık kontrolü çıktılarını sakla
        uses: actions/upload-artifact@v7
        with:
          name: research-health-${{ github.run_id }}
          path: apps/technical_bot/reports/health-check/
          if-no-files-found: error
          retention-days: 7

  live-chart-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/chart_bot
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/chart_bot/requirements.txt
      - name: Bağımlılıkları yükle
        run: python -m pip install --requirement requirements.txt
      - name: Yeni /grafik dashboard'unu canlı veriyle doğrula
        run: |
          python -m src.technical_dashboard --symbol ASELS --interval 1d --outdir reports/health-chart
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = list(Path('reports/health-chart').glob('*_teknik_dashboard.png'))
          if len(files) != 1:
              raise SystemExit(f'expected one dashboard, got {files}')
          image = Image.open(files[0]).convert('RGB')
          if image.width < 2000 or image.height < 1400:
              raise SystemExit(f'dashboard resolution too small: {image.size}')
          if min(image.getpixel((5, 5))) < 230:
              raise SystemExit('dashboard is not using the white theme')
          if files[0].stat().st_size < 80_000:
              raise SystemExit('dashboard file unexpectedly small')
          print('CHART_DASHBOARD_OK', files[0], image.size)
          PY
      - name: Grafik dashboard çıktısını sakla
        uses: actions/upload-artifact@v7
        with:
          name: chart-health-${{ github.run_id }}
          path: apps/chart_bot/reports/health-chart/
          if-no-files-found: error
          retention-days: 7
