name: X Korumalı Hesap → Telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x-private-post-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/x_relay_bot/requirements.txt

      - name: Son gönderi durumunu geri yükle
        uses: actions/cache/restore@v4
        with:
          path: apps/x_relay_bot/state
          key: x-relay-state-restore-${{ github.run_id }}
          restore-keys: |
            x-relay-state-

      - name: Bağımlılıkları yükle
        working-directory: apps/x_relay_bot
        run: python -m pip install --requirement requirements.txt

      - name: Yeni X gönderilerini Telegram'a aktar
        working-directory: apps/x_relay_bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.X_RELAY_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.X_RELAY_TOPIC_ID }}
          X_RELAY_STATE_PATH: state/last_seen.json
          X_EXCLUDE_REPLIES: "true"
          X_EXCLUDE_RETWEETS: "true"
          TELEGRAM_PROTECT_CONTENT: "true"
          X_RELAY_BOOTSTRAP_SEND_LATEST: "false"
        run: python src/x_relay.py

      - name: Son gönderi durumunu kaydet
        if: ${{ success() && hashFiles('apps/x_relay_bot/state/last_seen.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: apps/x_relay_bot/state
          key: x-relay-state-${{ hashFiles('apps/x_relay_bot/state/last_seen.json') }}
