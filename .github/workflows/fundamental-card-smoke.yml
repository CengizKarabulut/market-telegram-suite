name: Fundamental Card Smoke

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: BIST symbol
        required: false
        default: GARAN
  pull_request:
    branches: [main]
    paths:
      - 'apps/technical_bot/src/fundamental_*.py'
      - 'apps/technical_bot/src/research_theme.py'
      - 'apps/technical_bot/tests/test_fundamental_analysis.py'
      - '.github/workflows/fundamental-card-smoke.yml'

permissions:
  contents: read

jobs:
  live-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/technical_bot
    env:
      TICKER: ${{ inputs.ticker || 'GARAN' }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt
      - name: Bağımlılıkları yükle
        run: python -m pip install --requirement requirements.txt
      - name: Canlı temel analiz kartı üret
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import matplotlib.image as mpimg

          from src.fundamental_analysis import build_fundamental_report
          from src.fundamental_card import render_fundamental_card
          from src.fundamental_quality import apply_coverage_policy
          from src.research_theme import apply_white_theme

          apply_white_theme()
          ticker = os.environ.get('TICKER', 'GARAN').strip().upper() or 'GARAN'
          out = Path('reports/fundamental-smoke')
          out.mkdir(parents=True, exist_ok=True)
          report = apply_coverage_policy(build_fundamental_report(ticker))
          png = render_fundamental_card(report, out / f'{ticker}_temel.png')
          (out / f'{ticker}_temel.json').write_text(
              json.dumps(report.to_dict(), ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('symbol:', report.symbol)
          print('profile:', report.profile)
          print('score:', report.overall_score)
          print('coverage:', report.coverage)
          print('factors:', [(item.name, item.score, item.coverage) for item in report.factors])
          print('positives:', report.positives)
          print('risks:', report.risks)
          print('png_bytes:', png.stat().st_size)
          if report.profile == 'BANK' and report.coverage < 0.45:
              raise SystemExit(f'Bank fundamental coverage too low: {report.coverage:.0%}')
          if png.stat().st_size < 10_000:
              raise SystemExit('Rendered card is unexpectedly small')
          corner = mpimg.imread(png)[2, 2, :3]
          if float(corner.min()) < 0.94:
              raise SystemExit(f'Fundamental card background is not white: {corner}')
          PY
      - name: Smoke çıktısını sakla
        uses: actions/upload-artifact@v7
        with:
          name: fundamental-card-${{ env.TICKER }}-${{ github.run_id }}
          path: |
            apps/technical_bot/reports/fundamental-smoke/*.png
            apps/technical_bot/reports/fundamental-smoke/*.json
          if-no-files-found: error
          retention-days: 7
