name: V4 Bütünleşik Hisse Analizi

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "BIST sembolü (ör. THYAO)"
        required: true
        default: "ZGYO"
      interval:
        description: "Teknik analiz aralığı"
        required: true
        default: "1d"
        type: choice
        options:
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 4h
          - 1d
          - 1wk
          - 1mo
      telegram:
        description: "Son analist paragrafını Telegram'a gönder"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - rebuild/v3-market-analysis-engine
    paths:
      - ".v4-equity-app-trigger"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_SYMBOL: ${{ github.event.inputs.symbol || 'ZGYO' }}
      APP_INTERVAL: ${{ github.event.inputs.interval || '1d' }}
      APP_TELEGRAM: ${{ github.event_name == 'push' || github.event.inputs.telegram == 'true' }}
    steps:
      - name: Ana repoyu checkout et
        uses: actions/checkout@v6

      - name: MA reaction scanner checkout
        uses: actions/checkout@v6
        with:
          repository: CengizKarabulut/ma-reaction-scanner
          ref: main
          path: external/ma-reaction-scanner

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/technical_bot/requirements.txt
            external/ma-reaction-scanner/requirements.txt

      - name: Teknik bot bağımlılıklarını yükle
        working-directory: apps/technical_bot
        run: python -m pip install --requirement requirements.txt

      - name: MA scanner bağımlılıklarını yükle
        working-directory: external/ma-reaction-scanner
        run: python -m pip install --requirement requirements.txt

      - name: Dış teknik kanıtları hazırla
        shell: bash
        run: |
          mkdir -p apps/technical_bot/reports/v4_external
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/CengizKarabulut/taramabot/main/state.json \
            --output apps/technical_bot/reports/v4_external/taramabot_state.json \
            || echo "Taramabot geçmişi alınamadı; analiz bu kanıt olmadan devam edecek."

      - name: Tek hisse MA destek/direnç taramasını çalıştır
        continue-on-error: true
        working-directory: external/ma-reaction-scanner
        shell: bash
        run: |
          python -m scanner.ma_scan \
            --universe custom \
            --asset-class stock \
            --market BIST \
            --symbol "$APP_SYMBOL" \
            --timeframes all \
            --source auto \
            --rank-by level \
            --output-dir reports/v4_single

      - name: MA watchlist çıktısını kopyala
        shell: bash
        run: |
          if [ -f external/ma-reaction-scanner/reports/v4_single/ma_watchlist.csv ]; then
            cp external/ma-reaction-scanner/reports/v4_single/ma_watchlist.csv \
              apps/technical_bot/reports/v4_external/ma_watchlist.csv
          else
            echo "MA watchlist üretilemedi; analiz bu kanıt olmadan devam edecek."
          fi

      - name: Teknik V4 okuyucu raporunu üret
        working-directory: apps/technical_bot
        env:
          PYTHONPATH: ../..
        shell: bash
        run: |
          python -m src.v3_preview_cli "$APP_SYMBOL" \
            --interval "$APP_INTERVAL" \
            --period 2y \
            --provider AUTO \
            --output reports/v3_preview \
            --scanner-state reports/v4_external/taramabot_state.json \
            --ma-watchlist reports/v4_external/ma_watchlist.csv

      - name: Güncel temel analiz ve KAP katmanını üret
        continue-on-error: true
        working-directory: apps/technical_bot
        env:
          PYTHONPATH: ../..
        run: |
          python -m src.v4_fundamental_probe "$APP_SYMBOL" \
            --financial-group AUTO \
            --output reports/v4_fundamental_probe

      - name: BIST sektör/eş şirket karşılaştırmasını üret
        continue-on-error: true
        working-directory: apps/technical_bot
        env:
          PYTHONPATH: ../..
        run: |
          python -m src.v4_peer_universe_probe "$APP_SYMBOL" \
            --limit 1000 \
            --output reports/v4_peer_universe

      - name: Tek paragraf bütünleşik analist görüşünü oluştur
        working-directory: apps/technical_bot
        env:
          PYTHONPATH: ../..
          TELEGRAM_BOT_TOKEN: ${{ secrets.TECHNICAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TECHNICAL_TOPIC_ID }}
        shell: bash
        run: |
          args=(
            "$APP_SYMBOL"
            --technical "reports/v3_preview/$APP_SYMBOL/${APP_SYMBOL}_report_v3.json"
            --fundamental-probe "reports/v4_fundamental_probe/$APP_SYMBOL/probe.json"
            --peer "reports/v4_peer_universe/$APP_SYMBOL/peer_benchmark.json"
            --output reports/v4_equity_app
          )
          if [ "$APP_TELEGRAM" = "true" ]; then
            args+=(--telegram)
          fi
          python -m src.v4_equity_compose "${args[@]}"

      - name: Uygulama çıktısını artifact olarak sakla
        uses: actions/upload-artifact@v7
        with:
          name: v4-equity-${{ github.event.inputs.symbol || 'ZGYO' }}-${{ github.event.inputs.interval || '1d' }}-${{ github.run_id }}
          path: |
            apps/technical_bot/reports/v4_equity_app/**
            apps/technical_bot/reports/v3_preview/**
            apps/technical_bot/reports/v4_fundamental_probe/**
            apps/technical_bot/reports/v4_peer_universe/**
            apps/technical_bot/reports/v4_external/**
          if-no-files-found: error
          retention-days: 7
