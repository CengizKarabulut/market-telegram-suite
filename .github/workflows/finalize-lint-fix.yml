name: Finalize Research Lint Fix

on:
  push:
    branches: [finalize/research-production]
    paths:
      - '.finalize-lint-fix'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: finalize/research-production
      - name: Apply final lint-safe equivalents
        run: |
          python - <<'PY'
          from pathlib import Path

          technical = Path('apps/technical_bot/src/research_technical.py')
          text = technical.read_text(encoding='utf-8')
          old = '''        if pivot["type"] == "high" and float(pivot["price"]) >= float(previous["price"]):
              result[-1] = pivot
          elif pivot["type"] == "low" and float(pivot["price"]) <= float(previous["price"]):
              result[-1] = pivot
'''
          new = '''        if (
              pivot["type"] == "high"
              and float(pivot["price"]) >= float(previous["price"])
          ) or (
              pivot["type"] == "low"
              and float(pivot["price"]) <= float(previous["price"])
          ):
              result[-1] = pivot
'''
          if old not in text:
              raise SystemExit('technical lint target not found')
          technical.write_text(text.replace(old, new, 1), encoding='utf-8')

          telegram = Path('apps/technical_bot/src/research_telegram.py')
          text = telegram.read_text(encoding='utf-8')
          old = '        raise RuntimeError("Telegram gönderiminde message_id doğrulanamadı.")\n'
          new = '        raise TypeError("Telegram gönderiminde message_id doğrulanamadı.")\n'
          if old not in text:
              raise SystemExit('telegram lint target not found')
          telegram.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot files
        run: rm -f .finalize-lint-fix .github/workflows/finalize-lint-fix.yml
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/technical_bot/src/research_technical.py apps/technical_bot/src/research_telegram.py .github/workflows/finalize-lint-fix.yml .finalize-lint-fix
          git commit -m 'Fix final research lint issues'
          git push origin HEAD:finalize/research-production
