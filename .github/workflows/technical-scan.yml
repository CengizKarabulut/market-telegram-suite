name: BIST Tarama — Bot Tetikler

on:
  schedule:
    # Europe/Istanbul = UTC+3
    # 1h: 10:20, 11:20, 12:20, 13:20, 14:20, 15:20, 16:20, 17:20, 18:20
    - cron: "20 7-15 * * 1-5"
    # 1h ek slot: 17:40
    - cron: "40 14 * * 1-5"
    # 4h: 11:00, 13:00
    - cron: "0 8,10 * * 1-5"
    # 4h: 14:30, 16:30, 17:30, 18:30
    - cron: "30 11,13-15 * * 1-5"
    # 1d: 10:45, 12:45, 14:45, 16:45, 17:45, 18:45
    - cron: "45 7,9,11,13-15 * * 1-5"
    # 1wk: 10:30
    - cron: "30 7 * * 1-5"
    # 1wk: 13:45
    - cron: "45 10 * * 1-5"
    # 1wk: 16:00
    - cron: "0 13 * * 1-5"
    # 1wk: 17:25
    - cron: "25 14 * * 1-5"
    # 1wk: 19:00
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Sembol kaynağı"
        required: true
        default: "auto"
        type: choice
        options: [auto, provider, file]
      limit:
        description: "En fazla sembol (0=sınırsız)"
        required: true
        default: "0"
      interval:
        description: "Mum aralığı veya liste"
        required: true
        default: "auto"
        type: choice
        options: [auto, "1h,4h", "1d,1wk", "1h,4h,1d,1wk", "1h", "4h", "1d", "1wk"]
      bb_rank_max:
        description: "Bollinger genişlik yüzdeliği üst sınırı"
        required: true
        default: "20"
      rvol_min:
        description: "Minimum RVOL"
        required: true
        default: "1.5"
      rvol_spike:
        description: "Hacim patlaması eşiği"
        required: true
        default: "3.0"
      min_turnover:
        description: "Minimum ortalama TL hacmi"
        required: true
        default: "20000000"
      report_top:
        description: "Detay kartı üretilecek yeni eşleşme sayısı"
        required: true
        default: "3"
      send_telegram:
        description: "Teknik botun konusuna gönder"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Her zamanlanmış slot bağımsız koşar; birbirine yakın farklı zaman dilimleri
# kuyrukta birbirini beklemez.
concurrency:
  group: technical-scan-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/technical_bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/technical_bot/requirements.txt
      - run: python -m pip install --requirement requirements.txt

      - name: Zaman dilimini çöz
        id: interval
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_INTERVAL: ${{ inputs.interval }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_EXPR" in
              "20 7-15 * * 1-5"|"40 14 * * 1-5") INTERVAL="1h" ;;
              "0 8,10 * * 1-5"|"30 11,13-15 * * 1-5") INTERVAL="4h" ;;
              "45 7,9,11,13-15 * * 1-5") INTERVAL="1d" ;;
              "30 7 * * 1-5"|"45 10 * * 1-5"|"0 13 * * 1-5"|"25 14 * * 1-5"|"0 16 * * 1-5") INTERVAL="1wk" ;;
              *)
                echo "Bilinmeyen schedule ifadesi: $SCHEDULE_EXPR" >&2
                exit 1
                ;;
            esac
          else
            INTERVAL="${MANUAL_INTERVAL:-auto}"
          fi
          echo "interval=$INTERVAL" >> "$GITHUB_OUTPUT"
          echo "Çalıştırılacak zaman dilimi: $INTERVAL"

      - name: Tarama durumunu geri yükle
        uses: actions/cache@v4
        with:
          path: |
            apps/technical_bot/reports/bist_universe.json
            apps/technical_bot/reports/scan_state.json
          key: technical-scan-${{ steps.interval.outputs.interval }}-${{ github.run_id }}
          restore-keys: |
            technical-scan-${{ steps.interval.outputs.interval }}-
            technical-scan-

      - name: Taramayı çalıştır
        env:
          INPUT_UNIVERSE: ${{ inputs.universe || 'auto' }}
          INPUT_LIMIT: ${{ inputs.limit || '0' }}
          INPUT_INTERVAL: ${{ steps.interval.outputs.interval }}
          INPUT_BB_RANK_MAX: ${{ inputs.bb_rank_max || '20' }}
          INPUT_RVOL_MIN: ${{ inputs.rvol_min || '1.5' }}
          INPUT_RVOL_SPIKE: ${{ inputs.rvol_spike || '3.0' }}
          INPUT_MIN_TURNOVER: ${{ inputs.min_turnover || '20000000' }}
          INPUT_REPORT_TOP: ${{ inputs.report_top || '3' }}
          SEND_TELEGRAM: ${{ github.event_name == 'schedule' || inputs.send_telegram }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TECHNICAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TECHNICAL_TOPIC_ID }}
        run: |
          SEND_FLAG=""
          if [ "$SEND_TELEGRAM" = "true" ]; then SEND_FLAG="--send-telegram"; fi
          python -m src.screener_cli \
            --universe "$INPUT_UNIVERSE" \
            --watchlist watchlist.txt \
            --limit "$INPUT_LIMIT" \
            --bb-rank-max "$INPUT_BB_RANK_MAX" \
            --rvol-min "$INPUT_RVOL_MIN" \
            --rvol-spike "$INPUT_RVOL_SPIKE" \
            --min-turnover "$INPUT_MIN_TURNOVER" \
            --interval "$INPUT_INTERVAL" \
            --report-top "$INPUT_REPORT_TOP" \
            --state reports/scan_state.json \
            $SEND_FLAG

      - name: Sonuçları sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bist-tarama-${{ github.run_id }}
          path: |
            apps/technical_bot/reports/screener.json
            apps/technical_bot/reports/bist_universe.json
            apps/technical_bot/reports/scan_state.json
            apps/technical_bot/reports/**/*.png
          if-no-files-found: warn
          retention-days: 30
