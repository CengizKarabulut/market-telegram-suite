name: V3 Core CI

on:
  pull_request:
    paths:
      - "market_core/**"
      - "tests_v3/**"
      - ".github/workflows/v3-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v3-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core test dependencies
        run: python -m pip install --upgrade pip pandas==2.3.1 numpy==2.3.2

      - name: Run V3 core tests
        run: python -m unittest discover -s tests_v3 -v
